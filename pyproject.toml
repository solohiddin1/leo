[project]
name = "leo"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "anyio==4.14.2",
    "argon2-cffi==25.1.0",
    "argon2-cffi-bindings==26.1.0",
    "asgiref==3.12.1",
    "ast-serialize==0.6.0",
    "attrs==26.1.0",
    "cachecontrol==0.14.4",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.4.9",
    "cryptography==50.0.1",
    "django==5.2.7",
    "django-jazzmin==3.0.1",
    "django-modeltranslation==0.20.3",
    "django-redis==7.0.0",
    "djangorestframework==3.17.1",
    "djangorestframework-simplejwt==5.5.0",
    "djangorestframework-stubs==3.16.9",
    "drf-spectacular==0.30.0",
    "firebase-admin==6.5.0",
    "google-api-core==2.34.0",
    "google-api-python-client==2.199.0",
    "google-auth==2.57.0",
    "google-auth-httplib2==0.4.2",
    "google-cloud-core==2.7.0",
    "google-cloud-firestore==2.29.0",
    "google-cloud-storage==3.13.1",
    "google-crc32c==1.8.0",
    "google-resumable-media==2.10.2",
    "grpcio==1.83.1",
    "grpcio-status==1.83.1",
    "gunicorn>=26.2.0",
    "h11==0.16.0",
    "h2==4.4.1",
    "hpack==4.2.0",
    "httpcore==1.0.9",
    "httplib2==0.32.0",
    "httpx==0.28.1",
    "hyperframe==6.1.0",
    "idna==3.18",
    "inflection==0.5.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "librt==0.13.0",
    "msgpack==1.2.2",
    "mypy==1.19.0",
    "mypy-extensions==1.1.0",
    "pathspec==1.1.1",
    "pillow==12.3.0",
    "proto-plus==1.28.4",
    "protobuf==7.36.0",
    "pyasn1==0.6.4",
    "pyasn1-modules==0.4.2",
    "pycparser==3.0",
    "pyjwt==2.9.0",
    "pyparsing==3.3.2",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "referencing==0.37.0",
    "requests==2.34.2",
    "rpds-py==2026.6.3",
    "sqlparse==0.6.0",
    "types-pyyaml==6.0.12.20260724",
    "typing-extensions==4.16.0",
    "uritemplate==4.2.0",
    "urllib3==2.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["N", "DJ", "E", "F", "W", "UP", "B"]  # merged, single table
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
"**/settings.py"      = ["E501", "F403", "F405"]
"**/tests.py"         = ["S101"]
"**/test_*.py"         = ["S101"]

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "root.settings"

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "djangorestframework-stubs>=3.16.9",
    "mypy>=1.19.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260724",
]
